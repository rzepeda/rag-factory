[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-factory"
version = "0.1.0"
description = "Configuration-driven composable RAG indexing and retrieval"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit/core"]
python_files = ["test_*.py"]
addopts = "-ra"
