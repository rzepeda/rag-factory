[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-factory"
version = "0.1.0"
description = "Configuration-driven composable RAG indexing and retrieval"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
rag-factory = "rag_factory.cli.main:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit/core"]
python_files = ["test_*.py"]
addopts = "-ra"

# Other suites are opt-in until their placeholders have been triaged.
markers = [
    "integration: requires configured infrastructure",
    "e2e: end-to-end executable workflow",
    "external: uses a real remote or locally hosted provider",
    "performance: reproducible benchmarks (not a correctness gate)",
]
