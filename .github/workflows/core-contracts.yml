name: Core contracts CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contracts:
    name: Build and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Test core contracts
        run: python -m pytest tests/unit/core/test_service_and_mapping_contracts.py -v
      - name: Check installable wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "from rag_factory.core.service_contracts import ServiceRequirement; from rag_factory.core.mapping import LogicalModel; from rag_factory.core.index_manifest import IndexManifest; print('Core contract imports OK')"
